name: Mizumi Review
description: "Self-learning PR review agent with BYOK, multi-provider support, and memory"
branding:
  icon: eye
  color: purple

inputs:
  github_token:
    description: "GitHub token for API access (automatically provided by Actions)"
    required: false
    default: "${{ github.token }}"
  anthropic_api_key:
    description: "Anthropic API key (use MIZUMI_ANTHROPIC_API_KEY secret to avoid credential collisions)"
    required: false
  openai_api_key:
    description: "OpenAI API key"
    required: false
  google_api_key:
    description: "Google AI API key"
    required: false
  openrouter_api_key:
    description: "OpenRouter API key"
    required: false
  nvidia_api_key:
    description: "NVIDIA NIM API key (nvapi-*)"
    required: false
  local_api_key:
    description: "API key for local/self-hosted model (Ollama/llama.cpp/LM Studio usually don't need one)"
    required: false
    default: "dummy"
  base_url:
    description: "Custom base URL for OpenAI-compatible endpoint. Local: Ollama (http://localhost:11434/v1), llama.cpp (http://localhost:8081/v1), LM Studio (http://localhost:1234/v1). Custom: Together AI, Groq, DeepSeek, Fireworks, etc."
    required: false
  model:
    description: "Model to use for review (e.g. claude-sonnet-4-6, gpt-4.1, gemini-2.5-flash)"
    required: false
    default: "claude-sonnet-4-6"
  provider:
    description: "LLM provider: anthropic | openai | google | openrouter | nvidia | local | custom"
    required: false
    default: "anthropic"
  custom_api_key:
    description: "API key for custom OpenAI-compatible endpoint (Together AI, Groq, DeepSeek, Fireworks, etc.)"
    required: false
  profile:
    description: "Review profile: chill (bugs/security), assertive (+ style/docs), followup (+ check previous comments)"
    required: false
    default: "chill"
  max_comments:
    description: "Maximum inline review comments per PR"
    required: false
    default: "15"
  language:
    description: "Review comment language (ISO locale code, e.g. en-US, ja-JP)"
    required: false
    default: "en-US"
  self_critique:
    description: "Enable two-pass self-critique (recommended)"
    required: false
    default: "true"
  confidence_threshold:
    description: "Filter findings with confidence below this value (0-100)"
    required: false
    default: "80"
  auto_review:
    description: "Auto-review on PR open/push (false = manual /mizumi trigger only)"
    required: false
    default: "true"
  auto_pause_after:
    description: "Stop auto-reviewing after this many reviews per PR (resume with /mizumi)"
    required: false
    default: "5"
  tier_routing:
    description: "Enable model tier routing (small diffs use cheaper model, security files get thorough review)"
    required: false
    default: "true"
  small_diff_threshold:
    description: "Line count threshold below which a diff is considered small for tier routing"
    required: false
    default: "50"
  compliance_check:
    description: "Check ticket-to-code compliance when PR references a GitHub Issue (closes #N, fixes #N)"
    required: false
    default: "true"
  auto_fix:
    description: "Auto-apply suggestion blocks when a thumbs-up reaction is found on Mizumi review comments"
    required: false
    default: "false"
  confidence_calibration:
    description: "Enable dual-model confidence calibration for borderline findings (confidence 60-80)"
    required: false
    default: "true"
  change_stack:
    description: "Reorganize large review output into cohort ordering (data models, contracts, logic, consumers, tests)"
    required: false
    default: "true"
  improve_enabled:
    description: "Enable /mizumi improve command (applies fix suggestions via Git Data API, requires contents: write)"
    required: false
    default: "false"
  dry_run:
    description: "Run analysis without posting review comments (logs findings to Actions output instead)"
    required: false
    default: "false"
  linter_scan:
    description: "Run project linters (ESLint, tsc, Prettier) before LLM review. Linter findings never hallucinate."
    required: false
    default: "true"
  auto_labels:
    description: "Auto-label PRs based on review findings (security, bug, style, needs-attention, review-heavy)"
    required: false
    default: "true"
  rpm:
    description: "Max requests per minute to the LLM provider (0 = use provider default: anthropic 50, openai 60, local unlimited)"
    required: false
    default: "0"
  rps:
    description: "Max requests per second to the LLM provider (0 = use provider default: anthropic 5, openai 5, local unlimited)"
    required: false
    default: "0"
  spend_threshold:
    description: "Post a spend dashboard comment when a single review exceeds this many tokens (0 = disabled)"
    required: false
    default: "0"
  gate_threshold:
    description: "Post a commit status (success/failure) usable as required branch protection check. none=disabled, critical=fail on critical, high=fail on high+critical, medium=fail on medium+"
    required: false
    default: "none"
  rule_engine:
    description: "Enable persistent rule engine with auto-discovery from PR history. Custom rules in .github/mizumi-rules.yml, auto-discovered from SQLite suggestion history, with rule decay."
    required: false
    default: "true"
  ci_validated_fix:
    description: "Enable CI-validated fix loop: apply suggestions, poll CI, revert on failure (requires improve_enabled=true)"
    required: false
    default: "false"
  ci_fix_timeout:
    description: "Max seconds to wait for CI checks on fix commit (0=no timeout)"
    required: false
    default: "600"
  ci_fix_max_retries:
    description: "Max number of fix attempts before giving up"
    required: false
    default: "3"
  ci_fix_revert_on_failure:
    description: "Revert fix commit if CI fails (recommended - prevents broken branches)"
    required: false
    default: "true"
  ast_contract_analysis:
    description: "Enable AST cross-file contract analysis (detects missing exports, unhandled throws, signature changes across files)"
    required: false
    default: "true"
  behavioral_summary:
    description: "Generate behavioral diff summary describing what the system DOES differently (not just which files changed). Runs for 3+ files with 50+ lines changed."
    required: false
    default: "true"
  ownership_routing:
    description: "Enable CODEOWNERS-aware review routing (tag owning teams, boost confidence for owned files)"
    required: false
    default: "true"
  delta_review:
    description: "Enable incremental delta review - on push to existing PR, only review the NEW diff since the last Mizumi review. Cuts token costs 50-80%."
    required: false
    default: "true"
  taint_analysis:
    description: "Enable taint-style data flow analysis - tracks untrusted input (req.params, process.argv, etc.) to security-sensitive sinks (SQL, exec, XSS, etc.). Generates evidence chains for LLM review context."
    required: false
    default: "true"
  review_learning:
    description: "Enable review-to-review learning — auto-generates negative rules from repeatedly-dismissed feedback patterns. Suppresses noisy finding categories across PRs."
    required: false
    default: "true"
  blast_radius:
    description: "Enable blast radius analysis - compute the set of files transitively impacted by each changed file using import/re-export dependency graphs. Injects impact context into LLM review."
    required: false
    default: "true"
  spec_compliance:
    description: "Enable spec-to-diff compliance - extract acceptance criteria from linked issues and verify each criterion against PR changes. Hybrid keyword + LLM matching."
    required: false
    default: "true"
  auth_boundary:
    description: "Enable auth boundary detector - scan route handlers for missing authentication. Supports Express, Fastify, Koa, Next.js, NestJS, and Hono. Flags unauthenticated routes as security findings."
    required: false
    default: "true"
  fatigue_dashboard:
    description: "Enable review fatigue dashboard - post per-category acceptance rates, dismissal trends, fatigue scores, and recommendations as a collapsible PR comment."
    required: false
    default: "true"
  secret_entropy:
    description: "Enable entropy-based secret detection - use Shannon entropy analysis on string literals to detect hardcoded secrets that regex patterns miss (random API keys, hex tokens, base64 credentials)."
    required: false
    default: "true"
  safety_score:
    description: "Enable PR safety score - post a 0-100 composite score as a separate commit status (finding severity, blast radius, attribution, risk). Gives maintainers a quantitative signal even when the gate is disabled."
    required: false
    default: "true"
  adaptive_strategy:
    description: "Enable PR type-adaptive review strategy - adjusts review focus based on PR category (security PRs get hardened scrutiny, docs PRs skip deep analysis). Only Qodo and Macroscope have similar features."
    required: false
    default: "true"
  business_context:
    description: "Enable business context integration - fetches Jira/Linear ticket details from PR body references and injects context into the review prompt. CodeRabbit, Bito, and Macroscope have similar features."
    required: false
    default: "true"
  org_memory:
  description: "Enable organizational memory - indexes past PR history by file paths, retrieves similar PRs for context injection. No other AI reviewer has cross-PR organizational learning."
  required: false
  default: "true"
swarm_review:
  description: "Enable parallel multi-perspective swarm review - 3 specialist agents (security, correctness, performance) review the PR simultaneously using lightweight models, then findings are deduplicated and merged. 74% more addressed comments (Greptile benchmark)."
  required: false
  default: "true"
suppression_memories:
  description: "Enable AI Memorized Triage — stores human dismissal reasoning in SQLite and auto-suppresses matching findings in future reviews. Zero LLM cost. No other AI reviewer has memorized triage."
  required: false
  default: "true"
complexity_prediction:
  description: "Enable PR complexity prediction — estimates review time (minutes) and complexity score (1-10) using multi-signal weighted model. Zero LLM cost. No other AI reviewer estimates review time."
  required: false
  default: "true"
pr_split_suggestions:
  description: "Enable PR split suggestions — when a PR is too complex, Mizumi suggests concrete file groupings for splitting into smaller PRs. Zero LLM cost. No other AI reviewer suggests HOW to split a PR."
  required: false
  default: "true"
  finding_lifecycle:
    description: "Enable finding lifecycle tracking — detect persisted, resolved, and new findings across pushes on the same PR. Surfaces unresolved findings from previous push. No other AI reviewer tracks finding lifecycle."
    required: false
    default: "true"

  intent_classification:
    description: "Enable semantic change intent classification — automatically label each diff file by intent (refactor, bugfix, feature, security, perf, dead code, test, docs, config). Zero LLM cost. No other AI reviewer classifies change intent."
    required: false
    default: "true"

  dep_impact_analysis:
    description: "Enable dependency change impact analysis — detect package.json/lockfile changes, classify risk (major bumps, new deps), and trace import impact. Zero LLM cost. No other AI reviewer analyzes dep impact."
    required: false
    default: "true"

  thread_continuity:
    description: "Enable review thread continuity — read author replies to prior review comments, detect dismissals, and avoid re-raising dismissed issues. No other AI reviewer reads prior thread conversations."
    required: false
    default: "true"

  cross_pr_persistence:
    description: "Enable cross-PR finding persistence — track recurring issue patterns across PRs (e.g., 'same issue found in 3 other PRs this month'). No other AI reviewer tracks findings across PRs."
    required: false
    default: "true"

  sarif_export:
    description: "Enable SARIF 2.1.0 export — upload findings to GitHub Code Scanning alerts tab (alongside CodeQL). No other AI reviewer integrates with Code Scanning."
    required: false
    default: "true"

  review_priority:
    description: "Enable per-finding priority scoring — each finding gets a 1-10 priority score combining severity, confidence, ownership, intent alignment, and cross-PR recurrence. Zero LLM cost. No other AI reviewer computes per-finding priority."
    required: false
    default: "true"

defense_framework:
  description: "Enable prompt injection defense framework — multi-layer defense-in-depth: input sanitization, content provenance tagging (user/retrieved/generated), output screening, and behavioral anomaly validation. No other AI code review tool has an explicit prompt injection defense layer."
  required: false
  default: "true"

 checks_api:
   description: "Enable GitHub Checks API integration — create Check Runs with annotations visible in the Checks tab, enabling branch protection integration beyond commit statuses. Like Codecov/SonarQube annotations. Zero LLM cost."
   required: false
   default: "true"
  chunk_review:
    description: "Enable adaptive chunked review — split large PRs (>10 files) into logical chunks by directory/area for higher review quality. No competitor does this. Zero LLM cost for planning."
    required: false
    default: "true"

  review_cache:
    description: "Enable per-file content-hash review result cache — skip re-reviewing unchanged files on iterative PR pushes for 30-70% token savings. No competitor caches by content hash."
    required: false
    default: "true"


  jira_base_url:
    description: "Jira instance base URL (e.g. https://myorg.atlassian.net). Also set via MIZUMI_JIRA_BASE_URL env var."
    required: false
  jira_api_token:
    description: "Jira API token for authentication. Also set via MIZUMI_JIRA_API_TOKEN env var."
    required: false
  jira_project_prefix:
    description: "Jira project key prefix for matching (e.g. PAY for PAY-1234). Also set via MIZUMI_JIRA_PROJECT_PREFIX env var."
    required: false
  linear_api_token:
    description: "Linear API token for authentication. Also set via MIZUMI_LINEAR_API_TOKEN env var."
    required: false
outputs:
  review_id:
    description: "ID of the posted PR review"
  finding_count:
    description: "Number of findings posted"
  risk_score:
    description: "Risk score 1-5"
  compliance:
    description: "Ticket-to-code compliance level (fully/partially/not/none)"
  auto_fixed:
    description: "Number of suggestions auto-applied via thumbs-up reaction approval"
runs:
  using: node24
  main: dist/index.js

permissions:
  contents: read
  pull-requests: write
  issues: write
  statuses: write
  checks: write
